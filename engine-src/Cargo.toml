[package]
name = "legal-structure-browser-engine"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# tools/refresh-engine.ps1 builds the packaged engine from this pin and Cargo.lock; legal-structure pins
# common-law-cite in turn.
legal-structure = { git = "https://github.com/eliziff/legal-structure-parser.git", rev = "97e7781d38e2e5e7038883929a9687922f30567a", default-features = false, features = ["canada", "journal", "provider-text", "citator"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
