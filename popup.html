<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Legal Pinpointer</title>
  <link rel="stylesheet" href="marker.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body data-tab="marker">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true">¶</span><span>Legal Pinpointer</span></div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button type="button" role="tab" data-tab="marker" aria-selected="true">Marker</button>
      <button type="button" role="tab" data-tab="copy" aria-selected="false">Copy</button>
      <button type="button" role="tab" data-tab="settings" aria-selected="false">Settings</button>
    </nav>
  </header>

  <main>
    <section class="panel" data-panel="marker" role="tabpanel">
      <div class="project">
        <select id="project" aria-label="Project"></select>
        <button type="button" class="icon" data-project="add" title="New project">+</button>
        <button type="button" class="icon" data-project="rename" title="Rename project">✎</button>
        <button type="button" class="icon" data-project="delete" title="Delete project">🗑</button>
      </div>
      <form class="inline" id="name-form" hidden>
        <input id="name-input" maxlength="80" autocomplete="off" spellcheck="false">
        <button type="submit">Save</button><button type="button" id="name-cancel" class="ghost">Cancel</button>
      </form>
      <div class="folders-head">
        <h2 class="label">Folders</h2>
        <select id="viewer-sort" aria-label="Sort documents">
          <option value="saved">Saved order</option><option value="alpha">A–Z</option><option value="newest">Newest</option>
        </select>
        <button type="button" class="link" id="copy-links">Copy links</button>
      </div>
      <div id="tree" class="tree" role="tree" aria-label="Folders"></div>
      <button type="button" class="new-folder" id="add-folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New folder</button>
      <div id="menu" class="menu" role="menu" hidden></div>
    </section>

    <section class="panel" data-panel="copy" role="tabpanel" hidden>
      <div class="doc" id="doc">
        <p class="doc-kind" id="doc-kind">Checking this page…</p>
        <p class="doc-cite" id="doc-cite"></p>
      </div>
      <div class="grid">
        <button type="button" class="action primary" data-copy="pinpoint" disabled><span>Pinpoint</span><kbd>Ctrl X</kbd></button>
        <button type="button" class="action primary" data-copy="quote" disabled><span>Quote</span><kbd>Ctrl ⇧ X</kbd></button>
        <button type="button" class="action" data-copy="citation" disabled><span>Citation</span><kbd>Alt X</kbd></button>
        <button type="button" class="action canlii" id="open-canlii" disabled><span>Open in CanLII</span><kbd>Alt C</kbd></button>
      </div>
      <div class="segmented" role="radiogroup" aria-label="Pinpoint format">
        <label><input type="radio" name="pinpointStyle" value="full"><span>at paras 12–14</span></label>
        <label><input type="radio" name="pinpointStyle" value="bare"><span>12–14</span></label>
      </div>
      <h2 class="label">Search &amp; links</h2>
      <div class="list">
        <button type="button" class="row" data-launch="LEGAL_PINPOINTER_OPEN_FIND"><span>Tab Search — search this window</span><kbd>Ctrl ⇧ S</kbd></button>
        <button type="button" class="row" data-launch="LEGAL_PINPOINTER_OPEN_CANLII_SEARCH"><span>CanLII text search</span><kbd>Alt ⇧ S</kbd></button>
        <button type="button" class="row" data-launch="LEGAL_PINPOINTER_PDF_LINK"><span>Link to copied text (PDFs)</span><kbd>Ctrl ⇧ F</kbd></button>
      </div>
      <p class="hint" id="shortcut-hint" hidden></p>
    </section>

    <section class="panel" data-panel="settings" role="tabpanel" hidden>
      <h2 class="label">Copying</h2>
      <div class="card">
        <label class="toggle"><span><b>Keyboard shortcuts</b><small>Ctrl+X, Ctrl+Shift+X, Alt+X and Alt+C on legal pages</small></span><input type="checkbox" data-setting="copyShortcuts"></label>
        <label class="toggle"><span><b>Link the whole pinpoint</b><small>For text-fragment sources, link “at para” too</small></span><input type="checkbox" data-setting="linkFullTextFragmentPinpoint"></label>
        <label class="toggle"><span><b>Link passages without structure</b><small>Text-fragment links on pages with no paragraphs or provisions</small></span><input type="checkbox" data-setting="buildTextFragmentWithoutStructure"></label>
      </div>
      <h2 class="label">On the page</h2>
      <div class="card">
        <label class="toggle"><span><b>Copy buttons on paragraphs</b><small>Pinpoint and pinpoint-with-text beside each paragraph or section, like Ctrl+X and Ctrl+Shift+X; with text selected, they copy the selection</small></span><input type="checkbox" data-setting="unitCopyButtons"></label>
        <label class="toggle"><span><b>Name in CanLII’s header</b><small>The full style of cause stays visible as you scroll, with a copy-link button, and titles the tab</small></span><input type="checkbox" data-setting="canliiHeader"></label>
        <label class="toggle"><span><b>Clean titles on Westlaw &amp; Lexis</b><small>A roomy, selectable title block with a copy-link button</small></span><input type="checkbox" data-setting="cleanTitles"></label>
        <label class="toggle"><span><b>CanLII button on Westlaw &amp; Lexis</b><small>Lit when a CanLII version is found</small></span><input type="checkbox" data-setting="canliiButton"></label>
        <label class="toggle"><span><b>Hide selection menus</b><small>Westlaw, Lexis and Practical Law’s highlight/annotate pop-ups</small></span><input type="checkbox" data-setting="suppressSelectionMenus"></label>
      </div>
      <h2 class="label">Tab Search</h2>
      <div class="card">
        <label class="toggle"><span><b>Wake sleeping tabs</b><small>Reload tabs Chrome discarded so they can be searched</small></span><input type="checkbox" data-setting="sonarWakeTabs"></label>
      </div>
      <h2 class="label">Case Marker</h2>
      <div class="card">
        <label class="toggle"><span><b>Circles on CanLII</b><small>On search results and document titles</small></span><input type="checkbox" data-setting="caseMarker"></label>
        <label class="field"><span>Hover + C files into</span><select data-slot="canliiHotkeySlot1"></select></label>
        <label class="field"><span>Hover + V files into</span><select data-slot="canliiHotkeySlot2"></select></label>
        <div class="field"><span>Data</span><span class="pair"><button type="button" class="ghost" id="export">Export</button><button type="button" class="ghost" id="import">Import</button></span></div>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
      <h2 class="label">PDF links</h2>
      <div class="card">
        <label class="toggle"><span><b>Link to copied text</b><small>Ctrl+Shift+F and the right-click menu</small></span><input type="checkbox" data-setting="pdfFragments"></label>
        <label class="field"><span>Copy as</span><select data-setting-select="pdfLinkFormat">
          <option value="url">The link</option><option value="text">The text, linked</option><option value="tag">The text + [Link]</option>
        </select></label>
      </div>
      <button type="button" class="link shortcuts" id="shortcuts">Change keyboard shortcuts…</button>
    </section>
  </main>

  <footer><p id="status" role="status" aria-live="polite"></p></footer>
  <script src="marker-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
