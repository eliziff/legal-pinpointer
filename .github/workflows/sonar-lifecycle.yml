name: Tab search lifecycle

on:
  pull_request:
    paths:
      - 'sonar*.js'
      - 'find-*.js'
      - 'tools/check-sonar-*.cjs'
      - '.github/workflows/sonar-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check lifecycle regressions
        run: node --test tools/check-sonar-broker.cjs tools/check-sonar-lifecycle.cjs
      - name: Install test-only browser tooling
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Verify the installed extension in Chromium
        run: node --test tools/check-sonar-browser.cjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-browser-evidence
          path: test-results/
