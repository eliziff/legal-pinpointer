name: Lens source integration snapshot
on:
  push:
    branches: [codex/pinpointer-lens-event-strip]
    paths: ['.github/workflows/lens-source-export.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar --exclude=.git --exclude=node_modules --exclude=lens-dist --exclude=lens/dist -czf /tmp/lens-source-current.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: lens-source-current
          path: /tmp/lens-source-current.tar.gz
          retention-days: 3
