<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tab Sonar · Legal Pinpointer</title>
  <link rel="stylesheet" href="sonar.css">
</head>
<body data-route="tabs">
  <main id="workspace">
    <header id="search-header">
      <nav aria-label="Search destination"><button id="tabs-route" aria-pressed="true">Open tabs</button><button id="canlii-route" aria-pressed="false">CanLII</button></nav>
      <form id="search-form" role="search">
        <label class="sr-only" for="query">Search open tabs</label>
        <div class="input-row"><input id="query" type="text" placeholder="Search open tabs" autocomplete="off" spellcheck="false" maxlength="1024"><button id="mode" type="button">/p</button></div>
        <div id="scope-row"><button id="scope" type="button">Current tab</button><button id="issues" type="button" class="quiet" hidden>Skipped tabs</button><button id="use-active" type="button" class="quiet">Use active tab</button></div>
        <p id="origin"></p>
      </form>
    </header>
    <div id="list-viewport" role="listbox" aria-label="Matching passages" tabindex="0">
      <div id="result-spacer"><div id="result-rows"></div></div>
      <p id="empty" hidden>No matching passages.</p>
    </div>
    <p id="notice" role="status" aria-live="polite"></p>
  </main>
  <section id="issue-popover" popover aria-label="Skipped tabs"><p id="limit-detail"></p><ul id="issue-list"></ul></section>
  <script src="find-core.js"></script>
  <script src="rerank-core.js"></script>
  <script src="sonar-results.js"></script>
  <script src="sonar.js"></script>
</body>
</html>
