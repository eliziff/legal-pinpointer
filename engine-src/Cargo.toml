[package]
name = "legal-structure-browser-engine"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The packaged legal-structure.wasm.gz (0.3.0) was built with tools/refresh-engine.ps1's settings
# from local sources: legal-structure e5525a0 and common-law-cite adfd3c8 (CanLII citation keys for
# legislation lookup, and CanLII's division and French decision-id codes). Both revisions are on
# GitHub; the pin below still names the older legal-structure revision.
legal-structure = { git = "https://github.com/eliziff/legal-structure-parser.git", rev = "0031ee8c5a73fa72273fb638b345de56dca73cd8", default-features = false, features = ["canada", "journal", "provider-text", "citator"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
