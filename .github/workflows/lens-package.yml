name: Pinpointer Lens offline package
on:
  push:
    branches: [codex/pinpointer-lens-event-strip]
    paths: ['lens/**', '.github/workflows/lens-package.yml', 'manifest.json', 'sonar.html', 'lens-launcher.js', 'content.js', 'text-fragments.js', 'core.js', 'providers.js']
permissions:
  contents: write
concurrency:
  group: pinpointer-lens-preview
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Commit the checked native bridge update
        if: hashFiles('lens/native.patch') != ''
        run: |
          git apply --check lens/native.patch
          git apply lens/native.patch
          git rm lens/native.patch
          git add content.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Integrate native Pinpointer range and clipboard bridge'
          git push origin HEAD:codex/pinpointer-lens-event-strip
      - run: npm test
      - run: npm install
        working-directory: lens
      - run: npm test
        working-directory: lens
      - run: python -m pip install numpy==2.3.3 safetensors==0.6.2 tokenizers==0.22.0
      - run: npm run build
        working-directory: lens
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Verify browser embedding arithmetic against the original tokenizer and vectors
        run: node test/embeddings-runtime.mjs > dist/embedding-validation.json
        working-directory: lens
      - name: Verify actual WASM inference and relevance ordering
        run: node verify-runtime.mjs
        working-directory: lens
      - run: python -m pip install pyarrow==21.0.0 pillow==11.3.0 && python lens/test/fixtures.py
      - run: npx playwright install --with-deps chromium
        working-directory: lens
      - run: npm run acceptance
        working-directory: lens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinpointer-lens-validation
          path: |
            runtime-validation.json
            lens/dist/embedding-validation.json
            lens/dist/validation.json
            lens/dist/lens-preview.png
            lens/dist/event-strip-preview.png
            lens/dist/build-info.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: lens-extension-package
          path: lens/dist/legal-pinpointer-lens.zip
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: event-strip-html
          path: lens/dist/event-strip.html
          compression-level: 1
          retention-days: 7
      - name: Publish downloadable preview files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="lens-preview-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" lens/dist/event-strip.html lens/dist/legal-pinpointer-lens.zip lens/dist/SHA256SUMS.txt lens/dist/build-info.json lens/dist/validation.json runtime-validation.json lens/dist/lens-preview.png lens/dist/event-strip-preview.png --target "$(git rev-parse HEAD)" --prerelease --title "Pinpointer Lens / Event Strip preview ${GITHUB_RUN_NUMBER}" --notes "Offline build. Packaged downloads are gated on real WASM inference and installed-extension acceptance. See validation.json and runtime-validation.json for the exact evidence."
